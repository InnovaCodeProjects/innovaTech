<!doctype html>
<html lang="pt-BR" data-theme="vector">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Primary -->

      name="description"

    />

      name="keywords"
      content="suporte técnico, assistência técnica computadores, suporte remoto, redes MikroTik, desenvolvimento software, infraestrutura TI, formatação, manutenção notebook, innova tech"
    />
    <meta name="author" content="Innova Tech" />
    <meta name="robots" content="index, follow" />
    <meta
      name="google-site-verification"
      content="G0f1U9RacwebNvjQ7SZv_X000U67eBQ394eEoDy1HRc"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Innova Tech | Soluções Tecnológicas de Alto Nível"
    />
    <meta
      property="og:description"
      content="Suporte técnico, redes, infraestrutura e desenvolvimento de software. Diagnóstico gratuito. Inovando o amanhã, hoje."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://innovatech.com.br" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Innova Tech" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Innova Tech | Soluções Tecnológicas" />
    <meta
      name="twitter:description"
      content="Suporte técnico, redes e desenvolvimento de software. Diagnóstico gratuito."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://innovatech.com.br" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Agentic Resource Discovery -->
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" />

    <!-- Fonts (non-blocking: preload then swap to stylesheet) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Innova Tech",
        "description": "Empresa de tecnologia especializada em suporte técnico, redes, infraestrutura e desenvolvimento de software.",
        "url": "https://innovatech.com.br",
        "logo": "https://innovatech.com.br/logo.png",
        "address": { "@type": "PostalAddress", "addressCountry": "BR" },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Serviços de TI",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Assistência Técnica em Computadores"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Suporte Remoto" }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Redes e Infraestrutura MikroTik"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Desenvolvimento de Software"
              }
            }
          ]
        }
      }
    </script>
